<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
    color: #222;

    min-height: 100vh;

    transition: 0.3s;
}


/* Header */

.header {
    background-color: #2563eb;
    color: white;

    padding: 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 20px;
}


.header h1 {
    margin-bottom: 5px;
}


#greeting {
    font-size: 15px;
}


#themeBtn {
    padding: 10px 15px;

    border: none;
    border-radius: 8px;

    cursor: pointer;

    background-color: white;
    color: #222;

    font-weight: bold;
}


/* Main Container */

.container {
    width: 90%;
    max-width: 900px;

    margin: 30px auto;
}


/* Common Section */

section {
    background-color: white;

    padding: 20px;

    margin-bottom: 20px;

    border-radius: 12px;

    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
}


/* Date */

.date-section {
    text-align: center;
}


#todayDate {
    display: inline-block;

    margin-top: 10px;

    font-size: 18px;
    font-weight: bold;
}


/* Quote */

.quote-section {
    text-align: center;
}


#quote {
    margin-top: 10px;

    font-style: italic;

    line-height: 1.5;
}


/* Task Form */

.task-section h2 {
    margin-bottom: 15px;
}


#taskForm {
    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}


#taskInput {
    flex: 1;

    min-width: 200px;

    padding: 12px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 16px;
}


#taskTime {
    padding: 12px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 16px;
}


#taskForm button {
    padding: 12px 20px;

    border: none;

    border-radius: 8px;

    background-color: #2563eb;

    color: white;

    cursor: pointer;

    font-size: 16px;
}


#taskForm button:hover {
    background-color: #1d4ed8;
}


/* List Header */

.list-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}


#clearBtn {
    background-color: #dc2626;

    color: white;

    border: none;

    padding: 8px 12px;

    border-radius: 6px;

    cursor: pointer;
}


/* Task List */

#taskList {
    list-style: none;
}


.task-item {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    padding: 15px;

    margin-bottom: 10px;

    border: 1px solid #ddd;

    border-radius: 8px;

    background-color: #fafafa;
}


.task-content {
    flex: 1;
}


.task-name {
    font-size: 17px;

    font-weight: bold;
}


.task-time {
    margin-top: 5px;

    font-size: 14px;

    color: #666;
}


/* Completed Task */

.completed .task-name {
    text-decoration: line-through;

    color: #888;
}


/* Buttons */

.task-buttons {
    display: flex;

    gap: 5px;
}


.complete-btn,
.delete-btn {
    border: none;

    padding: 8px 10px;

    border-radius: 6px;

    cursor: pointer;
}


.complete-btn {
    background-color: #16a34a;

    color: white;
}


.delete-btn {
    background-color: #dc2626;

    color: white;
}


/* Empty Message */

#emptyMessage {
    text-align: center;

    color: #777;

    padding: 20px;
}


/* Footer */

footer {
    text-align: center;

    padding: 20px;

    color: #777;
}


/* DARK MODE */

body.dark {
    background-color: #111827;

    color: white;
}


body.dark section {
    background-color: #1f2937;

    color: white;
}


body.dark .task-item {
    background-color: #374151;

    border-color: #4b5563;
}


body.dark .task-time {
    color: #d1d5db;
}


body.dark #taskInput,
body.dark #taskTime {
    background-color: #374151;

    color: white;

    border-color: #6b7280;
}


body.dark #themeBtn {
    background-color: #374151;

    color: white;
}


/* Responsive Design */

@media (max-width: 600px) {

    .header {
        flex-direction: column;

        text-align: center;
    }


    #taskForm {
        flex-direction: column;
    }


    #taskInput,
    #taskTime,
    #taskForm button {
        width: 100%;
    }


    .task-item {
        flex-direction: column;

        align-items: stretch;
    }


    .task-buttons {
        justify-content: flex-end;
    }

}

</style>

<body>

    <header class="header">

        <div>
            <h1>My To-Do App</h1>
            <p id="greeting"></p>
        </div>

        <button id="themeBtn">🌙 Dark Mode</button>

    </header>


    <main class="container">

        <!-- Date Section -->
        <section class="date-section">

            <h2>Today's Date</h2>

            <span id="todayDate"></span>

        </section>


        <!-- Quote Section -->
        <section class="quote-section">

            <h2>Quote of the Day</h2>

            <p id="quote"></p>

        </section>


        <!-- Add Task Section -->
        <section class="task-section">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task"
                    required
                >

                <input
                    type="time"
                    id="taskTime"
                >

                <button type="submit">
                    Add Task
                </button>

            </form>

        </section>


        <!-- Task List -->
        <section class="list-section">

            <div class="list-header">

                <h2>My Tasks</h2>

                <button id="clearBtn">
                    Clear All
                </button>

            </div>

            <ul id="taskList"></ul>

            <p id="emptyMessage">
                No tasks added yet.
            </p>

        </section>

    </main>


    <footer>

        <p>
            My To-Do App © 2026
        </p>

    </footer>


    <script>

// ==========================================
// TO-DO APPLICATION
// ==========================================


// Get HTML elements

const taskForm = document.getElementById("taskForm");

const taskInput = document.getElementById("taskInput");

const taskTime = document.getElementById("taskTime");

const taskList = document.getElementById("taskList");

const emptyMessage = document.getElementById("emptyMessage");

const clearBtn = document.getElementById("clearBtn");

const themeBtn = document.getElementById("themeBtn");

const greeting = document.getElementById("greeting");

const todayDate = document.getElementById("todayDate");

const quote = document.getElementById("quote");


// ==========================================
// TASK ARRAY
// ==========================================

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];


// ==========================================
// QUOTES
// ==========================================

const quotes = [

    "Believe in yourself and keep learning.",

    "Small progress is still progress.",

    "Success comes from consistent effort.",

    "Don't stop learning.",

    "Practice makes you better.",

    "Every expert was once a beginner.",

    "Your future depends on what you do today."

];


// ==========================================
// DISPLAY DATE
// ==========================================

function displayDate() {

    const today = new Date();

    const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    };

    todayDate.textContent =
        today.toLocaleDateString("en-IN", options);
}


// ==========================================
// DISPLAY GREETING
// ==========================================

function displayGreeting() {

    const hour = new Date().getHours();

    let message;


    if (hour < 12) {

        message = "Good Morning, User!";

    } else if (hour < 17) {

        message = "Good Afternoon, User!";

    } else {

        message = "Good Evening, User!";

    }


    greeting.textContent = message;
}


// ==========================================
// DISPLAY RANDOM QUOTE
// ==========================================

function displayQuote() {

    const randomIndex =
        Math.floor(Math.random() * quotes.length);

    quote.textContent =
        quotes[randomIndex];
}


// ==========================================
// DISPLAY TASKS
// ==========================================

function displayTasks() {

    taskList.innerHTML = "";


    if (tasks.length === 0) {

        emptyMessage.style.display = "block";

        return;

    }


    emptyMessage.style.display = "none";


    tasks.forEach(function(task) {

        const li = document.createElement("li");

        li.className = "task-item";


        if (task.completed) {

            li.classList.add("completed");

        }


        // Task content

        const taskContent =
            document.createElement("div");

        taskContent.className =
            "task-content";


        const taskName =
            document.createElement("div");

        taskName.className =
            "task-name";

        taskName.textContent =
            task.name;


        const taskTimeElement =
            document.createElement("div");

        taskTimeElement.className =
            "task-time";


        if (task.time) {

            taskTimeElement.textContent =
                "⏰ " + task.time;

        } else {

            taskTimeElement.textContent =
                "No time selected";

        }


        taskContent.appendChild(taskName);

        taskContent.appendChild(taskTimeElement);


        // Buttons

        const buttons =
            document.createElement("div");

        buttons.className =
            "task-buttons";


        const completeButton =
            document.createElement("button");

        completeButton.className =
            "complete-btn";

        completeButton.textContent =
            task.completed
                ? "Undo"
                : "Done";


        completeButton.addEventListener(
            "click",
            function() {

                toggleTask(task.id);

            }
        );


        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "delete-btn";

        deleteButton.textContent =
            "Delete";


        deleteButton.addEventListener(
            "click",
            function() {

                deleteTask(task.id);

            }
        );


        buttons.appendChild(completeButton);

        buttons.appendChild(deleteButton);


        // Add everything to li

        li.appendChild(taskContent);

        li.appendChild(buttons);


        taskList.appendChild(li);

    });
}


// ==========================================
// ADD TASK
// ==========================================

taskForm.addEventListener(
    "submit",
    function(event) {

        // Stop page refresh

        event.preventDefault();


        const taskName =
            taskInput.value.trim();

        const time =
            taskTime.value;


        // Validation

        if (taskName === "") {

            alert("Please enter a task.");

            return;

        }


        // Create task object

        const newTask = {

            id: Date.now(),

            name: taskName,

            time: time,

            completed: false

        };


        // Add task to array

        tasks.push(newTask);


        // Save

        saveTasks();


        // Display

        displayTasks();


        // Clear form

        taskInput.value = "";

        taskTime.value = "";

    }
);


// ==========================================
// SAVE TASKS
// ==========================================

function saveTasks() {

    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );
}


// ==========================================
// COMPLETE / UNCOMPLETE TASK
// ==========================================

function toggleTask(id) {

    tasks = tasks.map(function(task) {

        if (task.id === id) {

            task.completed =
                !task.completed;

        }

        return task;

    });


    saveTasks();

    displayTasks();
}


// ==========================================
// DELETE TASK
// ==========================================

function deleteTask(id) {

    tasks = tasks.filter(function(task) {

        return task.id !== id;

    });


    saveTasks();

    displayTasks();
}


// ==========================================
// CLEAR ALL TASKS
// ==========================================

clearBtn.addEventListener(
    "click",
    function() {

        if (tasks.length === 0) {

            alert("There are no tasks.");

            return;

        }


        const confirmDelete =
            confirm(
                "Are you sure you want to delete all tasks?"
            );


        if (confirmDelete) {

            tasks = [];

            saveTasks();

            displayTasks();

        }

    }
);


// ==========================================
// DARK / LIGHT MODE
// ==========================================

themeBtn.addEventListener(
    "click",
    function() {

        document.body.classList.toggle("dark");


        if (
            document.body.classList.contains("dark")
        ) {

            themeBtn.textContent =
                "☀️ Light Mode";

            localStorage.setItem(
                "theme",
                "dark"
            );

        } else {

            themeBtn.textContent =
                "🌙 Dark Mode";

            localStorage.setItem(
                "theme",
                "light"
            );

        }

    }
);


// ==========================================
// LOAD SAVED THEME
// ==========================================

function loadTheme() {

    const savedTheme =
        localStorage.getItem("theme");


    if (savedTheme === "dark") {

        document.body.classList.add("dark");

        themeBtn.textContent =
            "☀️ Light Mode";

    }

}


// ==========================================
// INITIALIZE APPLICATION
// ==========================================

displayDate();

displayGreeting();

displayQuote();

displayTasks();

loadTheme();

    </script>


</body>

</html>
